AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  AWS PRM Resource Tagging - Etapa 3 (automacao continua via EventBridge).

  ATENCAO - ESCOPO DESTE TEMPLATE: cobre só a Etapa 3 (detecção de criação de
  recurso + tagueamento reativo). NÃO inclui o Custom Resource da Etapa 1/2
  (mapeamento + tagueamento inicial na criação da stack) nem a Etapa 4
  (varredura periódica/drift) — nenhuma das duas está implementada ainda no
  repositório (ver README.md e docs/arquitetura-multicliente.md). A
  arquitetura de destino é UMA ÚNICA stack CloudFormation por conta cliente,
  implantada via StackSet — quando as Etapas 1/2/4 forem empacotadas, os
  recursos deste template (função Lambda, tópico SNS, regras de EventBridge,
  Step Functions) devem ser MESCLADOS numa única stack, não implantados como
  uma stack separada. Ver infra/README.md.

Parameters:
  ExpectedTagValue:
    Type: String
    AllowedPattern: "^pc:[A-Za-z0-9]+$"
    Description: >
      Valor esperado da tag aws-apn-id para esta conta/sub-OU (formato
      pc:<product-code>) — StackSet parameter, nunca hardcoded (mesmo
      princípio já usado em main.py --expected-tag-value).

  DebounceSeconds:
    Type: Number
    Default: 1800
    Description: >
      Espera (Step Functions Wait) entre o evento de criação do recurso e o
      processamento de fato — reduz a corrida com ferramentas de IaC que
      aplicam suas próprias tags pouco depois de criar o recurso. 1800s (30
      minutos) é o default combinado para o lançamento; ajustável por
      cliente via parâmetro do StackSet sem mudar código.

  LambdaReservedConcurrency:
    Type: Number
    Default: 5
    Description: >
      DECISÃO REGISTRADA (valor conservador, não validado contra volume real
      de criação de recursos em conta de cliente — ajustável depois): limita
      quantas invocações simultâneas desta função a conta permite, para não
      contribuir para throttling de API em contas com criação de recursos em
      rajada (ex.: Auto Scaling). Ver docs/melhorias-futuras.md.

  MaximumEventAgeInSeconds:
    Type: Number
    Default: 3600
    Description: >
      DECISÃO REGISTRADA (valor conservador, ajustável depois): EventBridge
      descarta a entrega ao alvo (Step Functions) se não conseguir entregá-la
      dentro desse tempo. Um evento de criação processado muito tarde já
      perdeu boa parte do valor de ser reativo — a Etapa 4 (varredura
      periódica, fora do escopo deste template) é o backstop para o que não
      for processado a tempo.

  NotificationEmail:
    Type: String
    Default: teste@exemplo.com
    Description: >
      E-mail assinado automaticamente no tópico SNS de relatório
      (PrmComplianceTopic) — sem isso, todo resultado publicado (sucesso ou
      falha) não chega a lugar nenhum (ver docs/melhorias-futuras.md,
      "Tópico SNS sem nenhuma assinatura"). O valor acima (teste@exemplo.com)
      É UM PLACEHOLDER, não um e-mail real — a assinatura fica presa em
      "PendingConfirmation" para sempre até alguém trocar por um endereço de
      verdade. Trocar o e-mail padrão para TODO deploy que não passar
      --parameter-overrides é UM ÚNICO lugar: o valor de Default acima (ver
      "E-mail de notificação (SNS)" em infra/README.md para o passo a passo
      completo, incluindo a confirmação manual que a AWS sempre exige por
      e-mail).

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256

Resources:
  # ---------------------------------------------------------------------
  # Tópico de relatório central (destino de push) — ver publish.py.
  # PRIMEIRO recurso de push de todo o projeto: nada em Etapas 1-2c publica
  # nada ainda. Quando a Etapa 4 for implementada, ela deve publicar neste
  # MESMO tópico (não criar um segundo) — ao mesclar numa única stack, este
  # recurso deve ficar na seção compartilhada, não duplicado por etapa.
  # ---------------------------------------------------------------------
  PrmComplianceTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-prm-compliance"
      DisplayName: "AWS PRM - eventos de compliance de tagging"

  # Assinatura automática do tópico acima — SEM ISSO, o tópico existe mas
  # ninguém ouve (achado confirmado na prática pelo smoke test em sandbox,
  # ver docs/melhorias-futuras.md). O e-mail vem do parâmetro
  # NotificationEmail (default é um placeholder, não um e-mail real — ver
  # descrição do parâmetro acima e infra/README.md). A confirmação por
  # clique no e-mail continua manual — nenhum CloudFormation pula isso, é
  # como o protocolo "email" do SNS sempre funcionou.
  PrmComplianceEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref PrmComplianceTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # ---------------------------------------------------------------------
  # Execução da função Lambda — permissões de leitura (Etapa 2b) + escrita
  # (Etapa 2c) já documentadas em docs/producao.md, mais as permissões
  # nativas por serviço necessárias além de tag:TagResources (ver docstring
  # de docs/producao.md, seção Etapa 2c) — só para os serviços do "lote
  # inicial" com extractor dedicado em event_parser.py. Os demais serviços
  # mapeados (fallback genérico de extração) vão falhar com AccessDenied até
  # a permissão nativa correspondente ser adicionada aqui — comportamento
  # seguro (reportado como erro, nunca uma ação incorreta), não uma lacuna
  # silenciosa.
  # ---------------------------------------------------------------------
  Etapa3ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PrmEtapa3RevalidationRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - tag:GetResources
                  - eks:ListTagsForResource
                  - bedrock:ListTagsForResource
                  - elasticloadbalancing:DescribeTags
                Resource: "*"
        - PolicyName: PrmEtapa3TagWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - tag:TagResources
                  - eks:TagResource
                  - bedrock:TagResource
                  - elasticloadbalancing:AddTags
                Resource: "*"
                # Restringe a ÚNICA chave de tag que a Etapa 3 tem motivo
                # para escrever (aws-apn-id) — mesmo que um bug no código
                # tentasse escrever outra chave, o IAM bloqueia antes de
                # chegar na API. `aws:TagKeys` é uma condition key global
                # suportada pelas APIs de tagging da AWS; NÃO testado em
                # sandbox contra as ~69 ações nativas abaixo (só confirmado
                # que a lógica do código sempre escreve 1 única chave) — ver
                # docs/melhorias-futuras.md.
                Condition:
                  ForAllValues:StringEquals:
                    aws:TagKeys: [aws-apn-id]
        - PolicyName: PrmEtapa3NativeTagWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  # Uma ação nativa por serviço mapeado (ver event_parser.py
                  # e event_mapping.py) — tag:TagResources exige essa
                  # permissão ALÉM de si mesma para o caminho genérico
                  # (confirmado na doc oficial, ver docs/producao.md). Nomes
                  # verificados contra o botocore instalado (não vem de
                  # memória) — ver "Permissões IAM — cobertura real" em
                  # infra/README.md. CodeBuild não entra aqui de propósito —
                  # confirmado em sandbox que tag:TagResources sozinho (já
                  # concedido por PrmEtapa3TagWrite) cobre esse serviço, sem
                  # ação nativa nenhuma (ver test/manual-live-etapa3/README.md).
                  - acm:TagResource
                  - acm-pca:TagCertificateAuthority
                  - apigateway:TagResource
                  - appsync:TagResource
                  - athena:TagResource
                  - backup:TagResource
                  - cassandra:TagResource
                  - clouddirectory:TagResource
                  - cloudfront:TagResource
                  - cloudhsm:AddTagsToResource
                  - codepipeline:TagResource
                  - cognito-identity:TagResource
                  - cognito-idp:TagResource
                  - connect:TagResource
                  - datapipeline:AddTags
                  - directconnect:TagResource
                  - dms:AddTagsToResource
                  - ds:AddTagsToResource
                  - dsql:TagResource
                  - dynamodb:TagResource
                  - ec2:CreateTags
                  - ecr:TagResource
                  - ecs:TagResource
                  - elasticache:AddTagsToResource
                  - elasticbeanstalk:UpdateTagsForResource
                  - elasticfilesystem:TagResource
                  - elasticmapreduce:AddTags
                  - es:AddTags
                  - finspace:TagResource
                  - firehose:TagDeliveryStream
                  - fsx:TagResource
                  - gamelift:TagResource
                  - glacier:AddTagsToVault
                  - healthlake:TagResource
                  - kafka:TagResource
                  - kendra:TagResource
                  - kinesis:TagResource
                  - kinesisanalytics:TagResource
                  - kinesisvideo:TagResource
                  - kms:TagResource
                  - lambda:TagResource
                  # Confirmado com erro real em sandbox: tag:TagResources
                  # chama logs:TagResource internamente (a API unificada),
                  # não logs:TagLogGroup (legada) — as duas existem no
                  # botocore, então a verificação original (só checar que a
                  # ação existe) não pegou que essa era a errada das duas.
                  - logs:TagResource
                  - m2:TagResource
                  - mediaconvert:TagResource
                  - medialive:CreateTags
                  - mediapackage:TagResource
                  - medical-imaging:TagResource
                  - memorydb:TagResource
                  - mq:CreateTags
                  - network-firewall:TagResource
                  - networkmanager:TagResource
                  - payment-cryptography:TagResource
                  - rds:AddTagsToResource
                  - redshift:CreateTags
                  - redshift-serverless:TagResource
                  - route53:ChangeTagsForResource
                  # S3 precisa das DUAS ações, não só Put — confirmado com
                  # erro real em sandbox (AccessDenied em s3:GetBucketTagging
                  # mesmo com tag:TagResources + s3:PutBucketTagging já
                  # concedidos): a implementação de tag:TagResources para
                  # buckets lê o TagSet atual antes de mesclar/escrever.
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                  - secretsmanager:TagResource
                  - sns:TagResource
                  - sqs:TagQueue
                  - ssm:AddTagsToResource
                  - states:TagResource
                  - storagegateway:AddTagsToResource
                  - timestream:TagResource
                  - transfer:TagResource
                  - vpc-lattice:TagResource
                  - workspaces:CreateTags
                Resource: "*"
                # Mesma restrição de PrmEtapa3TagWrite acima — só permite
                # escrever a chave aws-apn-id, mesmo com ~69 ações nativas
                # diferentes cobertas por esta política. Ver nota lá sobre
                # não ter sido testado em sandbox contra cada ação.
                Condition:
                  ForAllValues:StringEquals:
                    aws:TagKeys: [aws-apn-id]
        - PolicyName: PrmEtapa3PublishReport
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref PrmComplianceTopic

  Etapa3Function:
    Type: AWS::Serverless::Function
    Metadata:
      # `.samignore` NÃO é um mecanismo suportado pelo SAM CLI (confirmado
      # lendo o código-fonte instalado — nenhuma referência a "samignore"
      # em lugar nenhum do pacote `samcli`; uma versão anterior deste
      # template dependia disso e empacotava test/docs/infra/reference (e
      # qualquer JSON solto de smoke test manual) dentro da Lambda sem
      # ninguém perceber). `BuildMethod: makefile` é o mecanismo real —
      # ver `Makefile` na raiz de `CodeUri` (alvo `build-Etapa3Function`),
      # que copia só os módulos .py do pacote + o CSV oficial em `data/`.
      BuildMethod: makefile
    Properties:
      # CodeUri aponta para o diretório PAI de aws_prm_tagging/ (mesma
      # exigência de "Onde rodar os comandos" do README raiz) — para que
      # `aws_prm_tagging.handler_continuous_tagging.handler` seja
      # importável como pacote dentro da Lambda. O QUE de fato entra no
      # artefato é decidido pelo Makefile acima, não por tudo que existe
      # neste diretório.
      CodeUri: ../../
      Handler: aws_prm_tagging.handler_continuous_tagging.handler
      Role: !GetAtt Etapa3ExecutionRole.Arn
      ReservedConcurrentExecutions: !Ref LambdaReservedConcurrency
      Environment:
        Variables:
          EXPECTED_TAG_VALUE: !Ref ExpectedTagValue
          SNS_TOPIC_ARN: !Ref PrmComplianceTopic

  # ---------------------------------------------------------------------
  # Step Functions Standard — implementa o debounce (Wait) sem manter
  # nenhum compute ocioso: Standard Workflows cobram por transição de
  # estado, não por tempo de espera (ver docs/arquitetura.md). SQS não
  # serviria aqui de qualquer forma: DelaySeconds do SQS tem teto de 15
  # minutos, menos que os 30 minutos combinados.
  # ---------------------------------------------------------------------
  Etapa3StateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: statemachine/etapa3_delay_e_execucao.asl.json
      DefinitionSubstitutions:
        DebounceSeconds: !Ref DebounceSeconds
        LambdaArn: !GetAtt Etapa3Function.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref Etapa3Function

  # ---------------------------------------------------------------------
  # Role que o EventBridge assume para iniciar a execução do Step Functions
  # a partir de cada uma das regras abaixo.
  # ---------------------------------------------------------------------
  Etapa3EventBridgeInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartStateMachineExecution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref Etapa3StateMachine

  # ---------------------------------------------------------------------
  # Regras de EventBridge — CINCO regras, não uma só. O event pattern de
  # TODOS os serviços mapeados juntos ultrapassa a quota PADRÃO de 2.048
  # caracteres por pattern (ajustável via Service Quotas, mas preferimos
  # caber no default em vez de depender de um aumento de quota replicado em
  # ~80-90 contas de cliente via StackSet — excelência operacional/de
  # custo). Cada bloco abaixo é uma cópia exata de
  # infra/event_pattern.<N>.generated.json — gerados por
  # `event_mapping.build_event_patterns()`, NUNCA escritos à mão. Cada
  # alternativa também exige `errorCode` ausente (`{"exists": false}`) —
  # uma chamada de API que FALHOU (ex.: AccessDenied, nome já em uso) ainda
  # grava um evento no CloudTrail com o mesmo eventName, mas o recurso nunca
  # chegou a existir; sem esse filtro, a Etapa 3 gastaria uma invocação
  # Lambda tentando ler/taguear um ARN inexistente. Se o número de arquivos
  # gerados mudar (novo serviço mapeado empurra para mais uma regra),
  # adicione/remova o recurso AWS::Events::Rule correspondente aqui
  # manualmente — ver infra/README.md.
  # ---------------------------------------------------------------------
  Etapa3EventRule0:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-prm-etapa3-criacao-0"
      Description: "PRM Etapa 3 - deteccao de criacao de recurso (grupo 0 de 5, ver infra/event_pattern.0.generated.json)"
      State: ENABLED
      EventPattern:
        detail-type:
          - "AWS API Call via CloudTrail"
        $or:
          - source: ["aws.acm-pca"]
            detail: {eventName: ["CreateCertificateAuthority"], errorCode: [{exists: false}]}
          - source: ["aws.acm"]
            detail: {eventName: ["RequestCertificate"], errorCode: [{exists: false}]}
          - source: ["aws.apigateway"]
            detail: {eventName: ["CreateApi", "CreateRestApi"], errorCode: [{exists: false}]}
          - source: ["aws.appsync"]
            detail: {eventName: ["CreateGraphqlApi"], errorCode: [{exists: false}]}
          - source: ["aws.athena"]
            detail: {eventName: ["CreateDataCatalog", "CreateWorkGroup"], errorCode: [{exists: false}]}
          - source: ["aws.backup"]
            detail: {eventName: ["CreateBackupPlan", "CreateBackupVault"], errorCode: [{exists: false}]}
          - source: ["aws.bedrock"]
            detail: {eventName: ["CreateInferenceProfile"], errorCode: [{exists: false}]}
          - source: ["aws.cassandra"]
            detail: {eventName: ["CreateKeyspace", "CreateTable"], errorCode: [{exists: false}]}
          - source: ["aws.clouddirectory"]
            detail: {eventName: ["CreateDirectory"], errorCode: [{exists: false}]}
          - source: ["aws.cloudfront"]
            detail: {eventName: ["CreateDistribution"], errorCode: [{exists: false}]}
          - source: ["aws.cloudhsm"]
            detail: {eventName: ["CreateCluster"], errorCode: [{exists: false}]}
          - source: ["aws.codebuild"]
            detail: {eventName: ["CreateProject"], errorCode: [{exists: false}]}
          - source: ["aws.codepipeline"]
            detail: {eventName: ["CreatePipeline"], errorCode: [{exists: false}]}
          - source: ["aws.cognito-identity"]
            detail: {eventName: ["CreateIdentityPool"], errorCode: [{exists: false}]}
          - source: ["aws.cognito-idp"]
            detail: {eventName: ["CreateUserPool"], errorCode: [{exists: false}]}
          - source: ["aws.connect"]
            detail: {eventName: ["CreateInstance"], errorCode: [{exists: false}]}
          - source: ["aws.datapipeline"]
            detail: {eventName: ["CreatePipeline"], errorCode: [{exists: false}]}
      Targets:
        - Id: Etapa3StateMachineTarget
          Arn: !Ref Etapa3StateMachine
          RoleArn: !GetAtt Etapa3EventBridgeInvokeRole.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: !Ref MaximumEventAgeInSeconds

  Etapa3EventRule1:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-prm-etapa3-criacao-1"
      Description: "PRM Etapa 3 - deteccao de criacao de recurso (grupo 1 de 5, ver infra/event_pattern.1.generated.json)"
      State: ENABLED
      EventPattern:
        detail-type:
          - "AWS API Call via CloudTrail"
        $or:
          - source: ["aws.directconnect"]
            detail: {eventName: ["CreateConnection", "CreateDirectConnectGateway"], errorCode: [{exists: false}]}
          - source: ["aws.dms"]
            detail: {eventName: ["CreateReplicationInstance", "CreateReplicationTask"], errorCode: [{exists: false}]}
          - source: ["aws.ds"]
            detail: {eventName: ["CreateDirectory", "CreateMicrosoftAD"], errorCode: [{exists: false}]}
          - source: ["aws.dsql"]
            detail: {eventName: ["CreateCluster"], errorCode: [{exists: false}]}
          - source: ["aws.dynamodb"]
            detail: {eventName: ["CreateTable"], errorCode: [{exists: false}]}
          - source: ["aws.ec2"]
            detail: {eventName: ["CreateTransitGateway", "CreateVolume", "CreateVpc", "RunInstances"], errorCode: [{exists: false}]}
          - source: ["aws.ecr"]
            detail: {eventName: ["CreateRepository"], errorCode: [{exists: false}]}
          - source: ["aws.ecs"]
            detail: {eventName: ["CreateCluster", "CreateService"], errorCode: [{exists: false}]}
          - source: ["aws.eks"]
            detail: {eventName: ["CreateCluster", "CreateNodegroup"], errorCode: [{exists: false}]}
          - source: ["aws.elasticache"]
            detail: {eventName: ["CreateCacheCluster"], errorCode: [{exists: false}]}
          - source: ["aws.elasticbeanstalk"]
            detail: {eventName: ["CreateApplication", "CreateEnvironment"], errorCode: [{exists: false}]}
          - source: ["aws.elasticfilesystem"]
            detail: {eventName: ["CreateFileSystem"], errorCode: [{exists: false}]}
          - source: ["aws.elasticloadbalancing"]
            detail: {eventName: ["CreateLoadBalancer"], errorCode: [{exists: false}]}
          - source: ["aws.elasticmapreduce"]
            detail: {eventName: ["RunJobFlow"], errorCode: [{exists: false}]}
          - source: ["aws.es"]
            detail: {eventName: ["CreateDomain", "CreateElasticsearchDomain"], errorCode: [{exists: false}]}
          - source: ["aws.finspace"]
            detail: {eventName: ["CreateEnvironment"], errorCode: [{exists: false}]}
      Targets:
        - Id: Etapa3StateMachineTarget
          Arn: !Ref Etapa3StateMachine
          RoleArn: !GetAtt Etapa3EventBridgeInvokeRole.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: !Ref MaximumEventAgeInSeconds

  Etapa3EventRule2:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-prm-etapa3-criacao-2"
      Description: "PRM Etapa 3 - deteccao de criacao de recurso (grupo 2 de 5, ver infra/event_pattern.2.generated.json)"
      State: ENABLED
      EventPattern:
        detail-type:
          - "AWS API Call via CloudTrail"
        $or:
          - source: ["aws.firehose"]
            detail: {eventName: ["CreateDeliveryStream"], errorCode: [{exists: false}]}
          - source: ["aws.fsx"]
            detail: {eventName: ["CreateFileSystem"], errorCode: [{exists: false}]}
          - source: ["aws.gamelift"]
            detail: {eventName: ["CreateFleet"], errorCode: [{exists: false}]}
          - source: ["aws.glacier"]
            detail: {eventName: ["CreateVault"], errorCode: [{exists: false}]}
          - source: ["aws.healthlake"]
            detail: {eventName: ["CreateFHIRDatastore"], errorCode: [{exists: false}]}
          - source: ["aws.kafka"]
            detail: {eventName: ["CreateClusterV2"], errorCode: [{exists: false}]}
          - source: ["aws.kendra"]
            detail: {eventName: ["CreateIndex"], errorCode: [{exists: false}]}
          - source: ["aws.kinesis"]
            detail: {eventName: ["CreateStream"], errorCode: [{exists: false}]}
          - source: ["aws.kinesisanalytics"]
            detail: {eventName: ["CreateApplication"], errorCode: [{exists: false}]}
          - source: ["aws.kinesisvideo"]
            detail: {eventName: ["CreateStream"], errorCode: [{exists: false}]}
          - source: ["aws.kms"]
            detail: {eventName: ["CreateKey"], errorCode: [{exists: false}]}
          - source: ["aws.lambda"]
            detail: {eventName: ["CreateFunction"], errorCode: [{exists: false}]}
          - source: ["aws.logs"]
            detail: {eventName: ["CreateLogGroup"], errorCode: [{exists: false}]}
          - source: ["aws.m2"]
            detail: {eventName: ["CreateApplication", "CreateEnvironment"], errorCode: [{exists: false}]}
          - source: ["aws.mediaconvert"]
            detail: {eventName: ["CreateQueue"], errorCode: [{exists: false}]}
          - source: ["aws.medialive"]
            detail: {eventName: ["CreateChannel"], errorCode: [{exists: false}]}
          - source: ["aws.mediapackage"]
            detail: {eventName: ["CreateChannel"], errorCode: [{exists: false}]}
          - source: ["aws.medical-imaging"]
            detail: {eventName: ["CreateDatastore"], errorCode: [{exists: false}]}
          - source: ["aws.memorydb"]
            detail: {eventName: ["CreateCluster"], errorCode: [{exists: false}]}
      Targets:
        - Id: Etapa3StateMachineTarget
          Arn: !Ref Etapa3StateMachine
          RoleArn: !GetAtt Etapa3EventBridgeInvokeRole.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: !Ref MaximumEventAgeInSeconds

  Etapa3EventRule3:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-prm-etapa3-criacao-3"
      Description: "PRM Etapa 3 - deteccao de criacao de recurso (grupo 3 de 5, ver infra/event_pattern.3.generated.json)"
      State: ENABLED
      EventPattern:
        detail-type:
          - "AWS API Call via CloudTrail"
        $or:
          - source: ["aws.mq"]
            detail: {eventName: ["CreateBroker"], errorCode: [{exists: false}]}
          - source: ["aws.network-firewall"]
            detail: {eventName: ["CreateFirewall"], errorCode: [{exists: false}]}
          - source: ["aws.networkmanager"]
            detail: {eventName: ["CreateCoreNetwork", "CreateGlobalNetwork"], errorCode: [{exists: false}]}
          - source: ["aws.payment-cryptography"]
            detail: {eventName: ["CreateKey"], errorCode: [{exists: false}]}
          - source: ["aws.rds"]
            detail: {eventName: ["CreateDBCluster", "CreateDBInstance"], errorCode: [{exists: false}]}
          - source: ["aws.redshift-serverless"]
            detail: {eventName: ["CreateWorkgroup"], errorCode: [{exists: false}]}
          - source: ["aws.redshift"]
            detail: {eventName: ["CreateCluster"], errorCode: [{exists: false}]}
          - source: ["aws.resiliencehub"]
            detail: {eventName: ["CreateApp"], errorCode: [{exists: false}]}
          - source: ["aws.route53"]
            detail: {eventName: ["CreateHostedZone"], errorCode: [{exists: false}]}
          - source: ["aws.s3"]
            detail: {eventName: ["CreateBucket"], errorCode: [{exists: false}]}
          - source: ["aws.secretsmanager"]
            detail: {eventName: ["CreateSecret"], errorCode: [{exists: false}]}
          - source: ["aws.sns"]
            detail: {eventName: ["CreateTopic"], errorCode: [{exists: false}]}
          - source: ["aws.sqs"]
            detail: {eventName: ["CreateQueue"], errorCode: [{exists: false}]}
          - source: ["aws.ssm"]
            detail: {eventName: ["CreateOpsItem"], errorCode: [{exists: false}]}
          - source: ["aws.states"]
            detail: {eventName: ["CreateStateMachine"], errorCode: [{exists: false}]}
          - source: ["aws.storagegateway"]
            detail: {eventName: ["CreateCachediSCSIVolume", "CreateNFSFileShare", "CreateSMBFileShare", "CreateStorediSCSIVolume"], errorCode: [{exists: false}]}
          - source: ["aws.timestream"]
            detail: {eventName: ["CreateDatabase"], errorCode: [{exists: false}]}
          - source: ["aws.transfer"]
