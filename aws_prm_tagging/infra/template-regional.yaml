  # ---------------------------------------------------------------------
  # Regra de evento NATIVO do EC2 (não CloudTrail) — cobre instâncias de
  # QUALQUER origem (RunInstances, CreateFleet/Karpenter, Auto Scaling com
  # MixedInstancesPolicy/Spot, node groups do EKS) e NÃO depende de uma
  # trail do CloudTrail. Substitui o antigo `RunInstances` nas regras de
  # CloudTrail. Pattern = event_mapping.NATIVE_EVENT_PATTERNS
  # ["ec2_instance_running"] (guarda de deriva em
  # test/unit/test_infra_event_patterns.py). Também dispara quando uma
  # instância parada é iniciada — a revalidação da Etapa 2c torna isso
  # idempotente (resultado `ja_ok`, sem escrita).
  # ---------------------------------------------------------------------
  Etapa3NativeEc2InstanceRunningRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-prm-etapa3-ec2-running"
      Description: "PRM Etapa 3 - instancia EC2 entrou em running (evento nativo, qualquer origem)"
      State: ENABLED
      EventPattern:
        source: ["aws.ec2"]
        detail-type: ["EC2 Instance State-change Notification"]
        detail: {state: ["running"]}
      Targets:
        - Id: Etapa3StateMachineTarget
          Arn: !Ref Etapa3StateMachine
          RoleArn: !GetAtt Etapa3EventBridgeInvokeRole.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: !Ref MaximumEventAgeInSeconds
          DeadLetterConfig:
            Arn: !GetAtt Etapa3EventsDlq.Arn

  # Item 14 — pattern = event_mapping.NATIVE_EVENT_PATTERNS["ecs_task_running"].
  # Tagueia a TASK via ecs:TagResource (nunca ecs:UpdateService — decisão
  # de 2026-09-30); ligar propagateTags vira recomendação (recomendacoes.py).
  Etapa3NativeEcsTaskRunningRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-prm-etapa3-ecs-task-running"
      Description: "PRM Etapa 3 - task ECS Fargate entrou em RUNNING (evento nativo, item 14)"
      State: ENABLED
      EventPattern:
        source: ["aws.ecs"]
        detail-type: ["ECS Task State Change"]
        detail: {lastStatus: ["RUNNING"], desiredStatus: ["RUNNING"], launchType: ["FARGATE"]}
      Targets:
        - Id: Etapa3StateMachineTarget
          Arn: !Ref Etapa3StateMachine
          RoleArn: !GetAtt Etapa3EventBridgeInvokeRole.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: !Ref MaximumEventAgeInSeconds
          DeadLetterConfig:
            Arn: !GetAtt Etapa3EventsDlq.Arn

  # ---------------------------------------------------------------------
  # Etapa 4 — alerta de drift/remoção da tag quase em tempo real.
  # Pattern = event_mapping.DRIFT_EVENT_PATTERN (guarda de deriva em
  # test_infra_event_patterns.py). Alvo é a Lambda direto (sem debounce):
  # o handler relê o estado do recurso antes de alertar. Só alerta —
  # reaplicar fica com a varredura recorrente (stack hub). Reaproveita a
  # role da Etapa 3 (mesmas leituras de tag + sns:Publish no hub).
  # ---------------------------------------------------------------------
  Etapa4DriftFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../../
      Handler: aws_prm_tagging.handler_drift.handler
      Role: !GetAtt Etapa3ExecutionRole.Arn
      Environment:
        Variables:
          EXPECTED_TAG_VALUE: !Ref ExpectedTagValue
          FILTRO_ESCOPO: !Ref FiltroEscopoTeste
          SNS_TOPIC_ARN: !Sub "arn:${AWS::Partition}:sns:${HubRegion}:${AWS::AccountId}:${HubTopicName}"

  Etapa4DriftRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-prm-etapa4-drift"
      Description: "PRM Etapa 4 - remocao/substituicao de tags (alerta de drift da aws-apn-id)"
      State: ENABLED
      EventPattern:
        detail-type: ["AWS API Call via CloudTrail"]
        detail:
          eventName:
            - prefix: Untag
            - prefix: RemoveTags
            - DeleteTags
            - PutBucketTagging
            - DeleteBucketTagging
            - ChangeTagsForResource
            - UpdateTagsForResource
          errorCode: [{exists: false}]
      Targets:
        - Id: Etapa4DriftTarget
          Arn: !GetAtt Etapa4DriftFunction.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: !Ref MaximumEventAgeInSeconds
          DeadLetterConfig:
            Arn: !GetAtt Etapa3EventsDlq.Arn

  Etapa4DriftInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Etapa4DriftFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt Etapa4DriftRule.Arn

Outputs:
  HubTopicArn:
    Description: "Tópico SNS (na stack HUB) onde esta região publica os resultados."
    Value: !Sub "arn:${AWS::Partition}:sns:${HubRegion}:${AWS::AccountId}:${HubTopicName}"

  Etapa3EventsDlqUrl:
    Description: "DLQ desta região — eventos que o EventBridge não conseguiu entregar e execuções que falharam."
    Value: !Ref Etapa3EventsDlq

  Etapa3StateMachineArn:
    Value: !Ref Etapa3StateMachine

  Etapa3FunctionArn:
    Value: !GetAtt Etapa3Function.Arn
