AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  AWS PRM Resource Tagging - Etapa 3, stack REGIONAL.

  Implantada em TODAS as regiões ativas da conta (+ us-east-1 sempre, única
  região onde o EventBridge recebe eventos de serviços globais) via
  StackSet. Contém tudo que é por região: regras do EventBridge, Step
  Functions (debounce), Lambda, IAM e a DLQ. NÃO contém o tópico SNS — ele
  vive na stack HUB (template-hub.yaml), uma única vez por conta, e esta
  stack publica nele pelo ARN montado a partir de HubRegion/HubTopicName.
  Ordem de deploy: hub primeiro, regional depois. Ver infra/README.md.

Parameters:
  ExpectedTagValue:
    Type: String
    Default: pc:825bh0xhwumf14tg27cthnoss
    AllowedPattern: "^pc:[A-Za-z0-9]+$"
    Description: "Valor da tag aws-apn-id (pc:<product code>). Default: o product code da Darede."

  DebounceSeconds:
    Type: Number
    Default: 1800
    Description: >
      Espera (Step Functions Wait) entre o evento de criação do recurso e o
      processamento de fato — reduz a corrida com ferramentas de IaC que
      aplicam suas próprias tags pouco depois de criar o recurso. 1800s (30
      minutos) é o default combinado para o lançamento; ajustável por
      cliente via parâmetro do StackSet sem mudar código.

  LambdaReservedConcurrency:
    Type: Number
    Default: 5
    Description: >
      Limite de invocações simultâneas desta função (valor conservador),
      para não contribuir para throttling de API em contas que criam
      recursos em rajada (ex.: Auto Scaling).

  MaximumEventAgeInSeconds:
    Type: Number
    Default: 3600
    Description: >
      DECISÃO REGISTRADA (valor conservador, ajustável depois): EventBridge
      descarta a entrega ao alvo (Step Functions) se não conseguir entregá-la
      dentro desse tempo. Um evento de criação processado muito tarde já
      perdeu boa parte do valor de ser reativo — a Etapa 4 (varredura
      periódica, fora do escopo deste template) é o backstop para o que não
      for processado a tempo.

  FiltroEscopoTeste:
    Type: String
    Default: ""
    Description: >
      SÓ PARA CONTA COMPARTILHADA (sandbox). A Etapa 3 não tem dry-run:
      sem filtro, tagueia qualquer recurso criado na região, por qualquer
      pessoa. Com termos (separados por vírgula), reage só a eventos cujo
      principal (ARN do usuário/role) OU cujo ARN de recurso contenha um
      deles — ex.: "user/fulano,prm-val". Vazio = sem filtro (produção).
      Também filtra os alertas de drift.

  PublicarResultadoJaOk:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      "false" suprime a publicação no SNS dos resultados "ja_ok" (recurso que
      já estava com a tag correta). Útil em contas com muita rotação de tasks
      ECS/Fargate, onde cada task que já nasce com a tag (propagateTags)
      geraria um e-mail sem informação nova. Default "true" mantém o
      contrato original (todo resultado é publicado).

  HubRegion:
    Type: String
    Default: us-east-1
    AllowedPattern: "^[a-z]{2}(-[a-z]+)+-[0-9]$"
    Description: >
      Região onde a stack HUB (template-hub.yaml) foi implantada — é lá que
      está o tópico SNS de relatório. Publicar num tópico de outra região
      funciona apontando o client para a região do ARN (o handler já faz
      isso), sem Fn::ImportValue cross-region.

  HubTopicName:
    Type: String
    Default: prm-compliance
    Description: >
      Nome do tópico SNS criado pela stack HUB (parâmetro TopicName de
      template-hub.yaml). Precisa ser o mesmo nos dois templates.

  TopicoCentralArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws[a-z-]*:sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]{1,256}$"
    Description: >
      ARN do tópico CENTRAL na conta payer (template-central.yaml), para
      rollout por StackSets. Preenchido, esta região publica lá. Vazio
      (default) = tópico da stack HUB.

  TopicoCentralKmsArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]{36}$"
    Description: >
      Chave KMS do tópico central (saída ChaveTopicoArn de
      template-central.yaml). Necessária quando TopicoCentralArn é usado: o
      tópico central é criptografado e quem publica precisa gerar a chave
      de dados.

  RetencaoLogsDias:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: >
      Retenção dos logs das Lambdas. Os log groups fazem parte da stack e
      são apagados junto com ela.

  Arquitetura:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: >
      arm64 (Graviton) custa ~20% menos por GB-s e consome menos energia.
      O código e a layer são Python puro, funcionam nas duas. Use x86_64 se
      alguma região ainda não oferecer Lambda arm64.

Conditions:
  UsaTopicoCentral: !Not [!Equals [!Ref TopicoCentralArn, ""]]
  TemChaveCentral: !Not [!Equals [!Ref TopicoCentralKmsArn, ""]]

Globals:
  Function:
    Architectures:
      - !Ref Arquitetura
    Runtime: python3.12
    Layers:
      - !Ref PrmSdkLayer
    Timeout: 60
    MemorySize: 256

Resources:
  # boto3/botocore atuais, fixados por hash
  # (requirements-lambda.txt). O runtime traz um SDK mais antigo; a layer
  # vem antes dele no sys.path. Uma layer por stack, para todas as funções.
  PrmSdkLayer:
    Type: AWS::Serverless::LayerVersion
    Metadata:
      BuildMethod: makefile
      BuildArchitecture: x86_64
    Properties:
      Description: boto3/botocore fixados para as Lambdas do PRM tagging
      ContentUri: ../../
      CompatibleRuntimes:
        - python3.12
      CompatibleArchitectures:
        - x86_64
        - arm64
      RetentionPolicy: Delete

  # ---------------------------------------------------------------------
  # Role da Lambda: leitura (revalidação) e escrita (só aws-apn-id), com a
  # ação nativa de tag de cada serviço mapeado, exigida além de
  # tag:TagResources. Serviço sem a ação nativa aqui falha com AccessDenied
  # (reportado como erro, nunca uma ação incorreta).
  # ---------------------------------------------------------------------
  Etapa3ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PrmEtapa3RevalidationRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - tag:GetResources
                  - eks:ListTagsForResource
                  - bedrock:ListTagsForResource
                  - elasticloadbalancing:DescribeTags
                  # Expansão instância -> volumes EBS anexados (resource_expansion.py):
                  # o volume root nasce junto com a instância e nunca gera um
                  # CreateVolume próprio. Somente leitura, sem custo.
                  - ec2:DescribeInstances
                  # RunInstances original de instância (evento nativo sem
                  # userAgent) — detecta Terraform/OpenTofu/Pulumi. Grátis, só leitura.
                  - cloudtrail:LookupEvents
                Resource: "*"
        - PolicyName: PrmEtapa3TagWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - tag:TagResources
                  - eks:TagResource
                  - bedrock:TagResource
                  - elasticloadbalancing:AddTags
                Resource: "*"
                # Só a chave aws-apn-id: mesmo um bug no código não
                # conseguiria escrever outra tag.
                Condition:
                  ForAllValues:StringEquals:
                    aws:TagKeys: [aws-apn-id]
        - PolicyName: PrmEtapa3NativeTagWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  # Uma ação nativa por serviço mapeado (tag:TagResources
                  # exige a do serviço além de si mesma). Nomes conferidos
                  # contra o botocore. CodeBuild não precisa: tag:TagResources
                  # basta.
                  - acm:TagResource
                  - acm-pca:TagCertificateAuthority
                  - appsync:TagResource
                  - athena:TagResource
                  - backup:TagResource
                  - cassandra:TagResource
                  - clouddirectory:TagResource
                  - cloudfront:TagResource
                  - cloudhsm:TagResource
                  - codepipeline:TagResource
                  - cognito-identity:TagResource
                  - cognito-idp:TagResource
                  - connect:TagResource
                  - datapipeline:AddTags
                  - appstream:TagResource
                  - bedrock-agentcore:TagResource
                  - comprehend:TagResource
                  - datasync:TagResource
                  - glue:TagResource
                  - iot:TagResource
                  - iotsitewise:TagResource
                  - omics:TagResource
                  - quicksight:TagResource
                  - sagemaker:AddTags
                  - securityhub:TagResource
                  - dax:TagResource
                  - workspaces-instances:TagResource
                  - deadline:TagResource
                  - directconnect:TagResource
                  - dms:AddTagsToResource
                  - ds:AddTagsToResource
                  - dsql:TagResource
                  - dynamodb:TagResource
                  - ec2:CreateTags
                  - ecr:TagResource
                  - ecs:TagResource
                  - elasticache:AddTagsToResource
                  - elasticbeanstalk:UpdateTagsForResource
                  - elasticfilesystem:TagResource
                  - elasticmapreduce:AddTags
                  - es:AddTags
                  - finspace:TagResource
                  - firehose:TagDeliveryStream
                  - fsx:TagResource
                  - gamelift:TagResource
                  - gameliftstreams:TagResource
                  - glacier:AddTagsToVault
                  - healthlake:TagResource
                  - kafka:TagResource
                  - kendra:TagResource
                  - kinesis:TagResource
                  - kinesisanalytics:TagResource
                  - kinesisvideo:TagResource
                  - kms:TagResource
                  - lambda:TagResource
                  # Confirmado com erro real em sandbox: tag:TagResources
                  # chama logs:TagResource internamente (a API unificada),
                  # não logs:TagLogGroup (legada) — as duas existem no
                  # botocore, então a verificação original (só checar que a
                  # ação existe) não pegou que essa era a errada das duas.
                  - logs:TagResource
                  - m2:TagResource
                  - mediaconvert:TagResource
                  - medialive:CreateTags
                  - mediapackage:TagResource
                  - medical-imaging:TagResource
                  - memorydb:TagResource
                  - mobiletargeting:TagResource
                  - mq:CreateTags
                  - network-firewall:TagResource
                  - networkmanager:TagResource
                  - payment-cryptography:TagResource
                  - rds:AddTagsToResource
                  - redshift:CreateTags
                  - redshift-serverless:TagResource
                  - route53:ChangeTagsForResource
                  - rtbfabric:TagResource
                  # S3 precisa das DUAS ações, não só Put — confirmado com
                  # erro real em sandbox (AccessDenied em s3:GetBucketTagging
                  # mesmo com tag:TagResources + s3:PutBucketTagging já
                  # concedidos): a implementação de tag:TagResources para
                  # buckets lê o TagSet atual antes de mesclar/escrever.
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                  - scn:TagResource
                  - secretsmanager:TagResource
                  - ses:TagResource
                  - sms-voice:TagResource
                  - sns:TagResource
                  - sqs:TagQueue
                  - ssm:AddTagsToResource
                  - states:TagResource
                  - storagegateway:AddTagsToResource
                  - timestream:TagResource
                  - transfer:TagResource
                  - vpc-lattice:TagResource
                  - workspaces:CreateTags
                Resource: "*"
                # Só a chave aws-apn-id.
                Condition:
                  ForAllValues:StringEquals:
                    aws:TagKeys: [aws-apn-id]
              # API Gateway não tem ação "TagResource": tag é um PUT no
              # recurso /tags/<arn>.
              - Effect: Allow
                Action: apigateway:PUT
                Resource: !Sub "arn:${AWS::Partition}:apigateway:*::/tags/*"
                Condition:
                  ForAllValues:StringEquals:
                    aws:TagKeys: [aws-apn-id]
        - PolicyName: PrmEtapa4DriftDlq
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # DLQ de função do Etapa4DriftFunction (mesma role da Etapa 3).
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt Etapa3EventsDlq.Arn
        - PolicyName: PrmEtapa3PublishReport
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource:
                  - !Sub "arn:${AWS::Partition}:sns:${HubRegion}:${AWS::AccountId}:${HubTopicName}"
                  - !If [UsaTopicoCentral, !Ref TopicoCentralArn, !Ref "AWS::NoValue"]
              - !If
                - TemChaveCentral
                - Effect: Allow
                  Action:
                    - kms:GenerateDataKey*
                    - kms:Decrypt
                  Resource: !Ref TopicoCentralKmsArn
                - !Ref "AWS::NoValue"

  Etapa3FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}/etapa3"
      RetentionInDays: !Ref RetencaoLogsDias

  Etapa3Function:
    Type: AWS::Serverless::Function
    Metadata:
      # O Makefile na raiz de CodeUri copia só os .py e o CSV de data/.
      BuildMethod: makefile
    Properties:
      # Diretório pai de aws_prm_tagging/, para o handler ser importável
      # como pacote.
      CodeUri: ../../
      Handler: aws_prm_tagging.handler_continuous_tagging.handler
      # 120 s (Globals = 60): a consulta ao histórico do CloudTrail
      # (instância EC2) pode esperar por throttling de LookupEvents (2/s)
      # quando muitas instâncias sobem juntas. Estourou: vai para a DLQ e a
      # varredura recorrente é o backstop.
      Timeout: 120
      LoggingConfig:
        LogGroup: !Ref Etapa3FunctionLogGroup
      Role: !GetAtt Etapa3ExecutionRole.Arn
      ReservedConcurrentExecutions: !Ref LambdaReservedConcurrency
      Environment:
        Variables:
          EXPECTED_TAG_VALUE: !Ref ExpectedTagValue
          FILTRO_ESCOPO: !Ref FiltroEscopoTeste
          PUBLICAR_JA_OK: !Ref PublicarResultadoJaOk
          SNS_TOPIC_ARN: !If
            - UsaTopicoCentral
            - !Ref TopicoCentralArn
            - !Sub "arn:${AWS::Partition}:sns:${HubRegion}:${AWS::AccountId}:${HubTopicName}"

  # ---------------------------------------------------------------------
  # Step Functions Standard — implementa o debounce (Wait) sem manter
  # nenhum compute ocioso: Standard Workflows cobram por transição de
  # estado, não por tempo de espera. SQS não
  # serviria aqui de qualquer forma: DelaySeconds do SQS tem teto de 15
  # minutos, menos que os 30 minutos combinados.
  # ---------------------------------------------------------------------
  Etapa3StateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: statemachine/etapa3_delay_e_execucao.asl.json
      DefinitionSubstitutions:
        DebounceSeconds: !Ref DebounceSeconds
        LambdaArn: !GetAtt Etapa3Function.Arn
        DlqUrl: !Ref Etapa3EventsDlq
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref Etapa3Function
        - SQSSendMessagePolicy:
            QueueName: !GetAtt Etapa3EventsDlq.QueueName

  # ---------------------------------------------------------------------
  # Role que o EventBridge assume para iniciar a execução do Step Functions
  # a partir de cada uma das regras abaixo.
  # ---------------------------------------------------------------------
  Etapa3EventBridgeInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartStateMachineExecution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref Etapa3StateMachine

  # ---------------------------------------------------------------------
  # Regras de EventBridge: o pattern de todos os serviços juntos passa da
  # quota padrão de 2.048 caracteres, então há uma regra por arquivo
  # infra/event_pattern.<N>.generated.json (gerados por
  # `event_mapping.build_event_patterns()`, nunca à mão). `errorCode`
  # ausente descarta chamadas que falharam. Se o número de arquivos mudar,
  # adicione/remova a regra correspondente aqui (ver infra/README.md).
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # DLQ da região. Recebe duas coisas:
  #   1. eventos que o EventBridge não conseguiu entregar ao Step Functions
  #      depois do RetryPolicy (DeadLetterConfig em cada alvo abaixo);
  #   2. execuções do Step Functions cuja Lambda falhou mesmo depois do
  #      Retry (estado EnviarParaDlq da state machine).
  # Sem isso, os dois casos sumiam sem rastro. Custo: praticamente zero (a
  # fila só recebe mensagem quando algo dá errado; SQS tem free tier de 1M
  # requisições/mês). Retenção máxima (14 dias) para dar tempo de
  # investigar. A leitura periódica da DLQ fica para a Etapa 4 (alarme
  # CloudWatch não pode notificar um SNS de outra região).
  # ---------------------------------------------------------------------
  Etapa3EventsDlq:
    Type: AWS::SQS::Queue
    Properties:
      # Nome FIXO (um por região, então não colide): a varredura recorrente
      # da Etapa 4 (stack hub) lê a profundidade desta fila em cada região e
      # usa a existência dela para detectar região ativa sem stack regional.
      # Ver handler_initial_tagging.NOME_DLQ_REGIONAL.
      QueueName: prm-etapa3-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  Etapa3EventsDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref Etapa3EventsDlq
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EventBridgeDlq
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt Etapa3EventsDlq.Arn
            Condition:
              ArnEquals:
                aws:SourceArn:
                  - !GetAtt Etapa3EventRule0.Arn
                  - !GetAtt Etapa3EventRule1.Arn
                  - !GetAtt Etapa3EventRule2.Arn
                  - !GetAtt Etapa3EventRule3.Arn
                  - !GetAtt Etapa3EventRule4.Arn
                  - !GetAtt Etapa3EventRule5.Arn
                  - !GetAtt Etapa3NativeEc2InstanceRunningRule.Arn
                  - !GetAtt Etapa3NativeEcsTaskRunningRule.Arn
                  - !GetAtt Etapa4DriftRule.Arn

  Etapa3EventRule0:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-prm-etapa3-criacao-0"
      Description: "PRM Etapa 3 - deteccao de criacao de recurso (grupo 0 de 6, ver infra/event_pattern.0.generated.json)"
      State: ENABLED
      EventPattern:
        detail-type:
          - "AWS API Call via CloudTrail"
        $or:
          - source: ["aws.acm-pca"]
            detail: {eventName: ["CreateCertificateAuthority"], errorCode: [{exists: false}]}
          - source: ["aws.acm"]
            detail: {eventName: ["RequestCertificate"], errorCode: [{exists: false}]}
          - source: ["aws.apigateway"]
            detail: {eventName: ["CreateApi", "CreateRestApi"], errorCode: [{exists: false}]}
          - source: ["aws.appstream"]
            detail: {eventName: ["CreateFleet", "CreateImageBuilder"], errorCode: [{exists: false}]}
          - source: ["aws.appsync"]
            detail: {eventName: ["CreateGraphqlApi"], errorCode: [{exists: false}]}
          - source: ["aws.athena"]
            detail: {eventName: ["CreateDataCatalog", "CreateWorkGroup"], errorCode: [{exists: false}]}
          - source: ["aws.backup"]
            detail: {eventName: ["CreateBackupPlan", "CreateBackupVault"], errorCode: [{exists: false}]}
          - source: ["aws.bedrock-agentcore"]
            detail: {eventName: ["CreateAgentRuntime", "CreateBrowser", "CreateCodeInterpreter", "CreateGateway", "CreateMemory", "CreateWorkloadIdentity"], errorCode: [{exists: false}]}
          - source: ["aws.bedrock"]
            detail: {eventName: ["CreateInferenceProfile"], errorCode: [{exists: false}]}
          - source: ["aws.cassandra"]
            detail: {eventName: ["CreateKeyspace", "CreateTable"], errorCode: [{exists: false}]}
          - source: ["aws.clouddirectory"]
            detail: {eventName: ["CreateDirectory"], errorCode: [{exists: false}]}
          - source: ["aws.cloudfront"]
            detail: {eventName: ["CreateDistribution", "CreateDistribution2020_05_31", "CreateDistributionWithTags", "CreateDistributionWithTags2020_05_31"], errorCode: [{exists: false}]}
          - source: ["aws.cloudhsm"]
            detail: {eventName: ["CreateCluster"], errorCode: [{exists: false}]}
          - source: ["aws.codebuild"]
            detail: {eventName: ["CreateProject"], errorCode: [{exists: false}]}
          - source: ["aws.codepipeline"]
            detail: {eventName: ["CreatePipeline"], errorCode: [{exists: false}]}
      Targets:
        - Id: Etapa3StateMachineTarget
          Arn: !Ref Etapa3StateMachine
          RoleArn: !GetAtt Etapa3EventBridgeInvokeRole.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: !Ref MaximumEventAgeInSeconds
          DeadLetterConfig:
            Arn: !GetAtt Etapa3EventsDlq.Arn

  Etapa3EventRule1:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-prm-etapa3-criacao-1"
      Description: "PRM Etapa 3 - deteccao de criacao de recurso (grupo 1 de 6, ver infra/event_pattern.1.generated.json)"
      State: ENABLED
      EventPattern:
        detail-type:
          - "AWS API Call via CloudTrail"
        $or:
          - source: ["aws.cognito-identity"]
            detail: {eventName: ["CreateIdentityPool"], errorCode: [{exists: false}]}
          - source: ["aws.cognito-idp"]
            detail: {eventName: ["CreateUserPool"], errorCode: [{exists: false}]}
          - source: ["aws.comprehend"]
            detail: {eventName: ["CreateDocumentClassifier", "CreateEndpoint", "CreateEntityRecognizer"], errorCode: [{exists: false}]}
          - source: ["aws.connect"]
            detail: {eventName: ["CreateInstance"], errorCode: [{exists: false}]}
          - source: ["aws.datapipeline"]
            detail: {eventName: ["CreatePipeline"], errorCode: [{exists: false}]}
          - source: ["aws.datasync"]
            detail: {eventName: ["CreateTask"], errorCode: [{exists: false}]}
          - source: ["aws.dax"]
            detail: {eventName: ["CreateCluster"], errorCode: [{exists: false}]}
          - source: ["aws.deadline"]
            detail: {eventName: ["CreateFarm", "CreateFleet", "CreateQueue"], errorCode: [{exists: false}]}
          - source: ["aws.directconnect"]
            detail: {eventName: ["CreateConnection", "CreateDirectConnectGateway"], errorCode: [{exists: false}]}
          - source: ["aws.dms"]
            detail: {eventName: ["CreateReplicationInstance", "CreateReplicationTask"], errorCode: [{exists: false}]}
          - source: ["aws.ds"]
            detail: {eventName: ["CreateDirectory", "CreateMicrosoftAD"], errorCode: [{exists: false}]}
          - source: ["aws.dsql"]
            detail: {eventName: ["CreateCluster"], errorCode: [{exists: false}]}
          - source: ["aws.dynamodb"]
            detail: {eventName: ["CreateTable", "RestoreTableFromBackup", "RestoreTableToPointInTime"], errorCode: [{exists: false}]}
          - source: ["aws.ec2"]
            detail: {eventName: ["AllocateAddress", "CopySnapshot", "CreateNatGateway", "CreateSnapshot", "CreateSnapshots", "CreateTransitGateway", "CreateVolume", "CreateVpc"], errorCode: [{exists: false}]}
          - source: ["aws.ecr"]
            detail: {eventName: ["CreateRepository"], errorCode: [{exists: false}]}
      Targets:
        - Id: Etapa3StateMachineTarget
          Arn: !Ref Etapa3StateMachine
          RoleArn: !GetAtt Etapa3EventBridgeInvokeRole.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: !Ref MaximumEventAgeInSeconds
          DeadLetterConfig:
            Arn: !GetAtt Etapa3EventsDlq.Arn

  Etapa3EventRule2:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-prm-etapa3-criacao-2"
      Description: "PRM Etapa 3 - deteccao de criacao de recurso (grupo 2 de 6, ver infra/event_pattern.2.generated.json)"
      State: ENABLED
      EventPattern:
        detail-type:
          - "AWS API Call via CloudTrail"
        $or:
          - source: ["aws.ecs"]
            detail: {eventName: ["CreateCluster", "CreateService"], errorCode: [{exists: false}]}
